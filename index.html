<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <h1>ICAL File To Google Sheets Table</h1>
    <p>Might work on Excel as well.</p>
    <p>Titles are interptreted to extract event details for agendas at HZ UAS</p>
    <p>All dates before the provided start date are ignored. Leave it blank to use all dates.</p>
    <p>The table should be generated automatically after you upload your ical file</p>
    <label for="start-date">Start date</label>
    <input type="date" name="start-date" id="start-date"></input>
    <label for="ical-file">Ical File</label>
    <input type="file" id="ics-file" accept=".ics,text/calendar" name="ical-file">
    <p id="status-indicator"></p>
    <button id="copy-btn">Copy Table</button>
    <pre id="output" style="font-family: monospace; overflow-x: auto; white-space: pre;"></pre>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
